services:
  feedwatch:
    # Single instance by design (shared state file). A stable short name keeps
    # `docker logs -f feedwatch` usable instead of feedwatch-feedwatch-1.
    container_name: feedwatch
    build: .
    image: feedwatch:latest
    # The image runs as the unprivileged "app" user; keep it by default, which
    # matches the ownership Docker gives the named volume below.
    # If /app/data is changed to a BIND MOUNT (e.g. ./data), the host directory
    # keeps its host owner and the container can no longer write state.json.
    # Override with the host uid:gid in that case, no chmod/chown needed:
    #   FW_UID=$(id -u) FW_GID=$(id -g) docker compose up -d
    # Compose only interpolates ${VAR}; it does NOT execute $(...), so .env
    # must hold plain numbers (see .env.example). These two are Compose-side
    # variables and are NOT passed into the container's environment.
    user: "${FW_UID:-app}:${FW_GID:-app}"
    # ${VAR:-} is substituted from the .env file in this directory.
    # Copy .env.example -> .env and fill in only the channels you enable.
    # Quote values containing & or ? in .env (e.g. WECOM_WEBHOOK_URL="...?key=x&y=z").
    environment:
      TZ: Asia/Shanghai
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:-}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      FEISHU_WEBHOOK_SECRET: ${FEISHU_WEBHOOK_SECRET:-}
      DINGTALK_WEBHOOK_URL: ${DINGTALK_WEBHOOK_URL:-}
      DINGTALK_WEBHOOK_SECRET: ${DINGTALK_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      BARK_WEBHOOK_URL: ${BARK_WEBHOOK_URL:-}
      NTFY_TOPIC_URL: ${NTFY_TOPIC_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      GENERIC_WEBHOOK_URL: ${GENERIC_WEBHOOK_URL:-}
      GENERIC_TOKEN: ${GENERIC_TOKEN:-}
      FEEDWATCH_STATE_PATH: /app/data/state.json
      FEEDWATCH_LOG_FORMAT: json
      FEEDWATCH_CONFIG: /app/config.yaml
    volumes:
      # Create ./config.yaml first: cp config.example.yaml config.yaml
      # (Docker would silently create a directory if the file is missing).
      # Read-only mount: editing feeds never requires rebuilding the image.
      - ./config.yaml:/app/config.yaml:ro
      # Persisted seen IDs: the key to staying silent across restarts.
      - feedwatch-data:/app/data
    restart: unless-stopped
    command: ["-config", "/app/config.yaml"]

volumes:
  feedwatch-data:
