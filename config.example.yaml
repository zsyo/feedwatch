    #     token: ${TELEGRAM_BOT_TOKEN}
    #     chat_id: ${TELEGRAM_CHAT_ID}       # @channel 或 -1001234567890
    #     parse_mode: HTML            # HTML(默认，最安全) | MarkdownV2 | Markdown | text
    # - type: slack
    #   options:
    #     webhook_url: ${SLACK_WEBHOOK_URL}
    # - type: discord
    #   options:
    #     webhook_url: ${DISCORD_WEBHOOK_URL}
    #     # username: FeedWatch
