# FeedWatch configuration reference (all supported keys).
# The tracked template: copy to config.yaml (gitignored) or config.local.yaml
# and adjust. Secrets never go here: the Resend key comes from the environment.

poll:
  interval: 30m          # Go duration: 10m / 30m / 1h / 6h
  run_on_start: true     # run one cycle immediately, then tick
  timeout: 2m            # hard timeout for one whole poll cycle
  concurrency: 4         # max simultaneous feed requests (1 = fully serial)
                         # 有界并发：订阅很多时不会被无限放大，也不会让慢 feed 饿死其它 feed
  request_spacing: 100ms # 两次 feed 请求「发起」之间的最小间隔（全局，0s 关闭）
                         # 大量 feed 指向同一域名（如 github.com）时用它削峰；
                         # N 个 feed 至少耗 N × spacing，feed 极多时请调大 timeout 或设为 0s

http:
  timeout: 15s           # per HTTP request
  user_agent: "feedwatch/1.0 (+https://github.com/zsyo/feedwatch)"
  retry_max: 3           # retries on network errors / 429 / 5xx
  retry_base_delay: 500ms
  conditional: true      # send ETag / Last-Modified, handle 304

store:
  type: jsonfile         # registry key; future: sqlite / redis
  path: data/state.json  # relative path; Docker overrides via env + VOLUME
  # options: {}          # passed through to the store implementation

notify:
  # ---- 全局项（对所有渠道生效）----
  mode: digest           # digest (one push per cycle) | per_feed (one per project)
                         # 每条通知都会发给所有 enabled 渠道；首轮基线始终是 1 条汇总
                         # per_feed 的标题会带上项目名；失败的批次只重试该项目
  send_spacing: 250ms    # 两次「同类型」渠道投递之间的最小间隔（每个渠道类型一个门，0s 关闭）
                         # per_feed + 多 feed + 多渠道时，防止短时间内打满某个 IM/邮件 API；
                         # 不同类型之间互不阻塞（email 慢不会拖住 telegram）
  # subject_prefix: "[FeedWatch]"   # 所有渠道共用的标题前缀，可省略
  # options: {}          # 所有渠道共享的默认值，被各渠道 options 覆盖
  #                      # 值里的 ${ENV_VAR} 启动时展开，缺失会直接报出变量名
  # on_partial_failure: best_effort  # 默认：至少一个渠道成功即算成功，避免重复推送
  #                     strict       # 任一渠道失败就报错，下轮整体重试（可能重复）

  # ---- 渠道列表：每个渠道的参数都写在自己的条目里 ----
  # 所有敏感值都用 ${ENV_VAR} 占位，容器/系统环境变量里放真实值，绝不写进 YAML。
  channels:
    - type: email                     # 默认只发邮件；替换或追加下面的条目即可
      email:                          # email 渠道专属参数
        provider: resend
        from: "FeedWatch <releases@your-verified-domain.com>"  # verified domain required
        to: [you@example.com]        # 多个收件人合并成 1 次 API 调用，最多 50 个；To/Cc 互相可见
        # cc: []
        # bcc 暂未暴露；需要互相不可见时可用多个 email 渠道分别发送
        api_key_env: RESEND_API_KEY   # 填环境变量「名字」，不是 ${...} 占位符

    # - type: wecom
    #   name: 企业微信群
    #   options:
    #     webhook_url: ${WECOM_WEBHOOK_URL}
    #     msg_type: markdown          # markdown(默认) | text
    #     # mentioned_list: "@all"    # 仅 text 有效
    # - type: feishu
    #   name: 飞书群
    #   options:
    #     webhook_url: ${FEISHU_WEBHOOK_URL}
    #     secret: ${FEISHU_WEBHOOK_SECRET}   # 可选：开启签名校验时填
    #     msg_type: text              # text(默认) | card（交互卡片）
    # - type: dingtalk
    #   options:
    #     webhook_url: ${DINGTALK_WEBHOOK_URL}
    #     secret: ${DINGTALK_WEBHOOK_SECRET} # 可选：开启「加签」时填（SEC 开头）
    #     msg_type: markdown          # markdown(默认) | text
    # - type: telegram
