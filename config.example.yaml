# FeedWatch configuration reference (all supported keys).
# The tracked template: copy to config.yaml (gitignored) or config.local.yaml
# and adjust. Secrets never go here: the Resend key comes from the environment.

poll:
  interval: 30m          # Go duration: 10m / 30m / 1h / 6h
  run_on_start: true     # run one cycle immediately, then tick
  timeout: 2m            # hard timeout for one whole poll cycle

http:
  timeout: 15s           # per HTTP request
  user_agent: "feedwatch/1.0 (+https://github.com/zsyo/feedwatch)"
  retry_max: 3           # retries on network errors / 429 / 5xx
  retry_base_delay: 500ms
  conditional: true      # send ETag / Last-Modified, handle 304

store:
  type: jsonfile         # registry key; future: sqlite / redis
  path: data/state.json  # relative path; Docker overrides via env + VOLUME
  # options: {}          # passed through to the store implementation

notify:
  # ---- 单通道（向后兼容）----
  type: email            # email | log | wecom | feishu | dingtalk | telegram |
                         # slack | discord | teams | bark | ntfy | webhook
  mode: digest           # digest (one push per cycle) | per_feed (one per project)
  email:
    provider: resend
    from: "FeedWatch <releases@your-verified-domain.com>"  # verified domain required
    to: [you@example.com]
    # cc: []
    subject_prefix: "[FeedWatch]"
    api_key_env: RESEND_API_KEY   # name of the env var holding the key
  # options: {}          # defaults shared by all channels; ${ENV_VAR} is expanded

  # ---- 多通道（推荐）----
  # channels 一旦出现就取代上面的 type：同一条通知会推送到每个 enabled 渠道。
  # 所有敏感值都用 ${ENV_VAR} 占位，容器/系统环境变量里放真实值，绝不写进 YAML。
  # on_partial_failure: best_effort  # 默认。至少一个渠道成功即算成功，避免重复推送
  #                     strict       # 任一渠道失败就报错，下轮整体重试（可能重复）
  # channels:
  #   - type: wecom
  #     name: 企业微信群
  #     options:
  #       webhook_url: ${WECOM_WEBHOOK_URL}
  #       msg_type: markdown          # markdown(默认) | text
  #       # mentioned_list: "@all"    # 仅 text 有效
  #   - type: feishu
  #     name: 飞书群
  #     options:
  #       webhook_url: ${FEISHU_WEBHOOK_URL}
  #       secret: ${FEISHU_WEBHOOK_SECRET}   # 可选：开启签名校验时填
  #       msg_type: text              # text(默认) | card（交互卡片）
  #   - type: dingtalk
  #     options:
  #       webhook_url: ${DINGTALK_WEBHOOK_URL}
  #       secret: ${DINGTALK_WEBHOOK_SECRET} # 可选：开启「加签」时填（SEC 开头）
  #       msg_type: markdown          # markdown(默认) | text
  #   - type: telegram
  #     options:
  #       token: ${TELEGRAM_BOT_TOKEN}
  #       chat_id: ${TELEGRAM_CHAT_ID}       # @channel 或 -1001234567890
  #       parse_mode: HTML            # HTML(默认，最安全) | MarkdownV2 | Markdown | text
  #   - type: slack
  #     options:
  #       webhook_url: ${SLACK_WEBHOOK_URL}
  #   - type: discord
  #     options:
  #       webhook_url: ${DISCORD_WEBHOOK_URL}
  #       # username: FeedWatch
  #       # avatar_url: https://...
  #   - type: teams
  #     options:
  #       webhook_url: ${TEAMS_WEBHOOK_URL}  # 用 Workflows 生成的 URL（Adaptive Card）
  #   - type: bark
  #     options:
  #       webhook_url: ${BARK_WEBHOOK_URL}   # https://api.day.app/<device_key>
  #       # group: FeedWatch
  #   - type: ntfy
  #     options:
  #       webhook_url: ${NTFY_TOPIC_URL}     # https://ntfy.sh/<topic>
  #       # token: ${NTFY_TOKEN}            # 自建服务需要鉴权时
  #       # priority: default
  #   - type: webhook                       # 通用：Gotify / Pushover / Server酱 / 自研
  #     options:
  #       webhook_url: ${GENERIC_WEBHOOK_URL}
  #       # method: POST
  #       # content_type: application/json
  #       # header.Authorization: Bearer ${GENERIC_TOKEN}
  #       # body: '{"title":{{json .Subject}},"message":{{json .Text}},"count":{{.Count}}}'
  #   # - type: email                       # 也可以把邮件混进多通道，复用上面的 email 块

log:
  level: info            # debug | info | warn | error
  format: text           # text | json

feeds:
  # type is the source registry key. Adding a source only requires a new
  # implementation package + one Register() line in cmd/feedwatch/main.go.
  - name: golang/go
    type: atom
    url: https://github.com/golang/go/releases.atom
    enabled: true
    filter:
      # Defaults (when omitted): stable_only=true. A 3~4 segment numeric version
      # is extracted from any human-readable title, e.g. "[release-branch.go1.27]
      # go1.27.3", "Rust 1.99.1", "v3.15.2". Suffixes like rc3/a1/-beta.1 and
      # non-version tags ("Python 3.10 end of life") are dropped.
      stable_only: true
      # include: ['^go\\d']                  # keep only titles matching any of these
      # exclude: ['(?i)nightly']            # drop titles matching any of these
      # version_pattern: '^v?(\\d+\\.\\d+\\.\\d+)$'  # override for 2-segment versions
    options:
      # content_policy: none | text (default, ~200 chars) | html
      content_policy: text

  - name: rust-lang/rust
    type: atom
    url: https://github.com/rust-lang/rust/releases.atom
    enabled: true
    filter:
      stable_only: true

  - name: python/cpython
    type: atom
    url: https://github.com/python/cpython/releases.atom
    enabled: true
    filter:
      stable_only: true
