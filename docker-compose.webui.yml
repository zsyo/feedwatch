# WebUI variant. Build and start with:
#   docker compose -f docker-compose.webui.yml up -d --build
#
# No config.yaml is needed: the container starts empty, prints a one-time admin
# password to its log, and everything else (subscriptions, channels, secrets) is
# configured in the browser. Mounting a config.yaml here has no effect.
#
# IMPORTANT: do NOT run this together with the base docker-compose.yml. Each
# variant has its own database and poller, so running both would send two sets
# of notifications for the same releases.
services:
  feedwatch-webui:
    container_name: feedwatch-webui
    build:
      context: .
      dockerfile: Dockerfile.webui
      args:
        VERSION: ${VERSION:-dev}
    image: feedwatch:webui
    # Defaults to the image's unprivileged app:app, matching the named volume.
    # For a BIND MOUNT of /app/data, set FW_UID/FW_GID to plain numeric host
    # ids in .env (Compose does not execute $(id -u)).
    # On ROOTLESS Docker the container uid is remapped to 100000+ on the host,
    # so those numbers never match: use `user: "0:0"` for a bind mount (container
    # root is your host user) or keep the named volume and no `user:` at all.
    user: "${FW_UID:-app}:${FW_GID:-app}"
    environment:
      # "Follow the server" resolves to this zone. Set TZ in .env to change the
      # default for accounts that never picked one.
      TZ: ${TZ:-Asia/Shanghai}
      # Default backend: the SQLite file below. Set FEEDWATCH_DB_DRIVER +
      # FEEDWATCH_DB_DSN in .env to run on MySQL / PostgreSQL instead; the data
      # volume then only carries secret.key.
      FEEDWATCH_DB_DRIVER: ${FEEDWATCH_DB_DRIVER:-}
      FEEDWATCH_DB_DSN: ${FEEDWATCH_DB_DSN:-}
      FEEDWATCH_DB_MAX_OPEN_CONNS: ${FEEDWATCH_DB_MAX_OPEN_CONNS:-10}
      FEEDWATCH_DATA_DIR: /app/data
      FEEDWATCH_DB_PATH: /app/data/feedwatch.db
      FEEDWATCH_HTTP_ADDR: :8080
      FEEDWATCH_LOG_FORMAT: json
      # Only enable Secure cookies behind an HTTPS reverse proxy; setting it to
      # true while serving plain HTTP makes logging in impossible.
      FEEDWATCH_WEBUI_COOKIE_SECURE: ${FEEDWATCH_WEBUI_COOKIE_SECURE:-false}
      FEEDWATCH_WEBUI_SESSION_TTL: ${FEEDWATCH_WEBUI_SESSION_TTL:-168h}
      # Optional master key (base64, 32 bytes) for encrypting channel secrets.
      # Leave it EMPTY and the container generates /app/data/secret.key once.
      # Set it only if you would rather manage the key yourself; in that case a
      # wrong/rotated key makes previously stored channel secrets unreadable.
      FEEDWATCH_WEBUI_SECRET_KEY: ${FEEDWATCH_WEBUI_SECRET_KEY:-}
    ports:
      - "${WEBUI_HTTP_PORT:-8080}:8080"
    volumes:
      # SQLite database + WAL side files + secret.key. Keep this volume: it is
      # the only state, and dropping it resets users and subscriptions.
      - feedwatch-webui-data:/app/data
    restart: unless-stopped

volumes:
  feedwatch-webui-data:
