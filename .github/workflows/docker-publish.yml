name: Publish Docker image (GHCR)

# Only release tags publish an image. Re-running a failed job keeps the same
# tag ref, so a manual dispatch (which has no semver ref) is intentionally
# not offered.
on:
  push:
    tags:
      - 'v*'

# Force-pushing a tag should not leave two builds racing to push the same digest.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build ${{ matrix.variant }} (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # required to push to GHCR with GITHUB_TOKEN
    # One push of vMAJOR.MINOR.PATCH produces two independent OCI indexes:
    #   base  -> {{version}}, {{major}}.{{minor}}, latest
    #   webui -> {{version}}-webui, {{major}}.{{minor}}-webui, webui
    # Each index carries linux/amd64 + linux/arm64. fail-fast:false keeps a
    # failure in one variant from cancelling the other.
    strategy:
      fail-fast: false
      matrix:
        variant: [base, webui]

    steps:
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not semver; use vMAJOR.MINOR.PATCH (e.g. v1.2.3)."
            exit 1
          fi
          # A hyphen in the validated form is always a prerelease suffix. The
          # webui pointer tag is gated on this so a prerelease moves no pointer.
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Prerelease $tag: neither 'latest' nor 'webui' will be moved."
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Publishing release $tag (${{ matrix.variant }})"

      - name: Checkout repository
        uses: actions/checkout@v7

      # The Go build itself is cross-compiled on the native amd64 runner (see
      # the Dockerfiles: FROM --platform=$BUILDPLATFORM). QEMU is only needed
      # for the runtime stage's `apk add` / `adduser` on the arm64 variant.
      # The webui Node stage also runs on $BUILDPLATFORM, so no emulation of
      # the frontend toolchain is involved.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (${{ matrix.variant }})
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # base keeps the conventional moving pointer (`latest`); the webui
          # variant publishes version tags with a `-webui` suffix but its moving
          # pointer is the bare `webui` tag, the same convention multi-flavour
          # images use on Docker Hub (no `latest-webui`).
          #
          # The suffix therefore lives in each semver pattern instead of
          # flavor.suffix: flavor applies to EVERY generated tag, which would
          # turn the `webui` pointer into `webui-webui`. `latest=false` stops
          # the webui job from also pushing a plain `latest` that would race
          # the base job for the same tag.
          flavor: |
            latest=${{ matrix.variant == 'webui' && 'false' || 'auto' }}
          # v1.2.3      -> 1.2.3, 1.2, latest           / 1.2.3-webui, 1.2-webui, webui
          # v1.2.3-rc.1 -> 1.2.3-rc.1                   / 1.2.3-rc.1-webui
          tags: |
            type=semver,pattern={{version}}${{ matrix.variant == 'webui' && '-webui' || '' }}
            type=semver,pattern={{major}}.{{minor}}${{ matrix.variant == 'webui' && '-webui' || '' }}
            type=raw,value=webui,enable=${{ matrix.variant == 'webui' && steps.release.outputs.prerelease == 'false' }}

      - name: Build and push ${{ matrix.variant }} (linux/amd64 + linux/arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          # Path context (not the Git context) so .dockerignore is honoured.
          # The base Dockerfile stays byte-for-byte unchanged; only the webui
          # variant points at the Node-stage Dockerfile.
          context: .
          file: ${{ matrix.variant == 'webui' && './Dockerfile.webui' || './Dockerfile' }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          # Isolate the layer caches: the two variants have very different
          # dependency sets (sqlite/bcrypt/node) and must not evict each other.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Write job summary (${{ matrix.variant }})
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ github.ref_name }}
          VARIANT: ${{ matrix.variant }}
          DOCKERFILE: ${{ matrix.variant == 'webui' && 'Dockerfile.webui' || 'Dockerfile' }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          {
            echo "### Published \`$VARIANT\` images to GHCR"
            echo ""
            echo "- Image: \`$IMAGE\`"
            echo "- Trigger tag: \`$TAG\`"
            echo "- Dockerfile: \`$DOCKERFILE\`"
            echo "- Platforms: linux/amd64, linux/arm64"
            echo "- Digest: \`$DIGEST\`"
            echo "- Tags:"
            while IFS= read -r t; do
              [ -z "$t" ] || echo "  - \`$t\`"
            done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
